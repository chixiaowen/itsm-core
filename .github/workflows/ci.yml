name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 环境硬约束（与本地一致）：镜像代理 + 锁定本地工具链
env:
  GOPROXY: https://goproxy.cn,direct
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  backend:
    name: 后端（vet + test + 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # 自动缓存 Go modules
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: go vet 静态检查
        run: go vet ./...

      - name: 运行单元测试（含竞态检测与覆盖率）
        run: go test ./... -count=1 -race -coverprofile=coverage.out -covermode=atomic

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out

      - name: 上传覆盖率产物
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  # 真实 PostgreSQL 集成测试：本地无 Docker/PG/达梦，故 SQLite 只作行为代理；
  # 此 job 用 postgres:16 提供方言级验证（integration_test.go 检测到 ITSM_TEST_DSN 即连 PG）。
  integration-postgres:
    name: 集成测试（真实 PostgreSQL 16）
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm
          POSTGRES_DB: itsm_core_test
        ports:
          - 5432:5432
        # 等待数据库就绪，避免测试抢跑
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ITSM_TEST_DSN: "host=127.0.0.1 port=5432 user=itsm password=itsm dbname=itsm_core_test sslmode=disable TimeZone=UTC"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 运行端到端集成测试（PostgreSQL）
        run: go test ./internal/bootstrap/... -count=1 -v

  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 自动缓存 npm，依赖锁文件为 frontend/package-lock.json
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        # 使用依赖锁定安装（frontend/package-lock.json 已提交）
        run: npm ci

      - name: 类型检查与构建
        run: npm run build
