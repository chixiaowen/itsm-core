server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 关闭版本号披露
    server_tokens off;

    # ---- 压缩 ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/vnd.ms-fontobject font/ttf font/opentype
                      image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 容器健康检查端点（由 nginx 直接响应，不落盘）----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- 静态资源：带 hash 的产物可长期缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 API 反向代理 ----
    # 前端以相对路径 /api/v1 发起请求，由 nginx 转发到 compose 网络内的 app 服务。
    # 显式关闭正向代理继承，避免继承宿主 http_proxy 影响容器内解析。
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 附件上传上限与后端 app.max_upload_mb 保持一致（20MB），留出余量
        client_max_body_size 25m;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- SPA 前端路由：未知路径回落到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，保证发布后立即生效
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 隐藏文件拒绝访问
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
